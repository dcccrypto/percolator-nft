name: Test
on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Both feature configurations must be exercised. The `devnet` feature is a
      # SECURITY gate: it is the only thing keeping the devnet wrapper id out of
      # the mainnet artifact, so a default build that silently regained it, or a
      # devnet build that stopped compiling, must both fail CI.
      - name: Run tests (default — this is the MAINNET artifact configuration)
        run: cargo test --lib --tests --verbose
      - name: Run tests (devnet — the configuration devnet deploys must use)
        run: cargo test --lib --tests --features devnet --verbose

      # #184 (4.3): CI ran neither clippy nor a BPF build, while the README asserts
      # "no warnings expected" for the SBF build. Two consequences seen in the audit
      # that produced #184: a clippy regression would not have been caught, and code
      # under `#[cfg(target_os = "solana")]` was never compiled by ANYTHING in CI —
      # which is exactly why #178 had to switch to a runtime `cfg!`.
      - name: Clippy (-D warnings, both feature configurations)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features devnet -- -D warnings

      # The SBF build is the artifact that actually ships. It is also the only build
      # that compiles the `target_os = "solana"` paths.
      # `stable`, not a pinned version — matching percolator-prog and percolator-stake.
      # A pinned v2.1.0 installer bundles cargo 1.79, which cannot parse a transitive
      # dependency requiring edition2024 (`toml_parser`), and that dependency arrives
      # through the engine dev-dependency #190 added for the layout-parity test. So the
      # pin failed the moment these two changes met. stake's CI carries the same note
      # for the same reason: release.anza.xyz does not serve every point release.
      - name: Install Solana toolchain (for build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build SBF artifact (devnet — the configuration devnet deploys must use)
        run: |
          cargo build-sbf -- --features devnet
          test -f target/deploy/percolator_nft.so || { echo "no .so produced"; exit 1; }

  # =========================================================================================
  # N-2 — THE ENGINE PIN IS NOT ALLOWED TO ROT.
  #
  # The `test` job above runs tests/layout_parity_160.rs against the engine PINNED in
  # Cargo.toml. That is a real check of the vendored mirror, and it was green for 228
  # commits while the mirror was 192 bytes behind the engine we ship — because the pin and
  # the mirror had drifted TOGETHER, so the test was comparing the mirror to a copy of
  # itself. N-1 found that by hand. This job is the thing that would have found it.
  #
  # It runs the SAME test against the engine percolator-prog actually compiles, which it
  # derives from percolator-prog's own ci.yml rather than assuming. See
  # scripts/engine-pin-check.sh for what "in sync" means and why it is layout equality
  # rather than SHA equality.
  #
  # This job CAN go red on a PR that changed nothing here — that is the point: it goes red
  # when the engine moves the portfolio layout out from under the mirror, and the fix is to
  # re-vendor (an N-1-shaped commit), not to relax the job.
  # =========================================================================================
  engine-pin:
    name: engine pin tracks the engine the wrapper ships
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout percolator-nft
        uses: actions/checkout@v4
        with: { path: percolator-nft }

      # The wrapper is what decides which engine ships, so its workflow is the input.
      # No `ref:`: percolator-prog's default branch, the same thing its own `parity` job
      # means when it checks THIS repository out with no ref.
      - name: checkout percolator-prog (the wrapper decides which engine ships)
        uses: actions/checkout@v4
        with: { repository: dcccrypto/percolator-prog, path: percolator-prog, token: '${{ secrets.GITHUB_TOKEN }}' }

      # NO `ref:` HERE, DELIBERATELY, and scripts/engine-pin-check.sh VERIFIES that it is
      # absent rather than trusting this comment: percolator-prog checks the engine out
      # with no ref too, so the engine both jobs compile is this repository's default-branch
      # tip. Adding a ref here would silently change which engine is measured, so the script
      # hard-fails if this step ever gains one while percolator-prog has not.
      #
      # fetch-depth: 0 because the ancestry check walks back to the pinned commit, which is
      # hundreds of commits deep whenever the pin has been left alone for a while — which is
      # exactly the case this job exists for.
      - name: checkout percolator (engine, default branch — same as the wrapper's CI)
        uses: actions/checkout@v4
        with: { repository: dcccrypto/percolator, path: percolator, fetch-depth: 0, token: '${{ secrets.GITHUB_TOKEN }}' }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: percolator-nft }

      - name: engine pin check (layout parity against the wrapper's engine)
        working-directory: percolator-nft
        run: ./scripts/engine-pin-check.sh
