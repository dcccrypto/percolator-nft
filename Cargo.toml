[package]
name = "percolator-nft"
version = "0.1.0"
edition = "2021"
description = "Position NFT wrapper for Percolator — mint transferable NFTs representing open perpetual positions"

[features]
no-entrypoint = []
test = []
kani = []
# Compiles the DEVNET wrapper id into the allowlist. A devnet id must never
# compile into a mainnet binary, so that a compromised devnet deploy keypair
# cannot inherit mainnet authority. Mirrors percolator-stake's `devnet` feature
# (percolator-stake/src/processor.rs) and percolator-prog's N-3 rationale.
# Devnet deploys must build with `--features devnet`.
devnet = []

[dependencies]
solana-program = "=2.2.1"
# pinocchio-token provides AccountState enum (SPL Token state discriminants, same layout).
# We use it for token account state validation without pulling in the full spl-token crate.
# Token-2022 instructions are built manually (no spl-token-2022 dep — avoids solana 2.1 conflict).
pinocchio-token = "0.5.0"
bytemuck = { version = "1.14", features = ["derive"] }

# Pin blake3/constant_time_eq to avoid edition2024 (SBF platform-tools has Rust 1.84)
[dependencies.blake3]
version = ">=1.5.0, <1.8.0"

[lints.rust]
# #184 (4.2): `target_os = "solana"` is REAL — it is what the SBF toolchain sets, and
# processor.rs uses it via a runtime `cfg!` (see #178). The host toolchain does not
# know the value, so declare it rather than silence the lint: the whole point of
# un-scoping the crate-wide allow is that a MISSPELLED cfg must still be an error.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(kani)',
  'cfg(target_os, values("solana"))',
] }

[patch.crates-io]
blake3 = { git = "https://github.com/BLAKE3-team/BLAKE3", tag = "1.5.5" }

[lib]
crate-type = ["cdylib", "lib"]

[dev-dependencies]
solana-sdk = "=2.2.1"
proptest = "1.4"

# GH#160 — the REAL engine, pinned, so the vendored mirror in slab_types_v16.rs can
# be checked against the layout it claims to mirror.
#
# The `const_assert!`s in that module measure the mirror against ITSELF. They prove
# internal consistency and nothing about correspondence to the engine, which is the
# failure SCHEMA_DRIFT_v12.19.md names: "mirror schema drift can mask itself as
# compile-pass". Every security decision the NFT program makes — owner, market_id
# slot-reuse anchor, lock/stale gate flags — is read through that mirror at a byte
# offset, so a silent reorder upstream reads garbage while every check still passes.
#
# A git dependency rather than a path: it needs no sibling checkout, so it works
# identically on a laptop and in CI, and the `rev` makes drift a DELIBERATE bump
# with a diff to read rather than something that follows main silently.
#
# dev-dependency only — the deployed program keeps its zero-dependency mirror and
# does not link the engine.
[dev-dependencies.percolator]
git = "https://github.com/dcccrypto/percolator"
rev = "99bc9c8d19c2f130b32bf0d5e867d1ad586f9517"
